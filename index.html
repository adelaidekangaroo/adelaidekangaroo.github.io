<!DOCTYPE HTML>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Sergey Simonov" />
    <meta property="og:description" content="Ты должен быть умней чем chatgpt." />
    <meta property="og:image" content="https://github.com/adelaidekangaroo/adelaidekangaroo/blob/main/qr-code.png?raw=true" />
    <meta property="og:url" content="https://adelaidekangaroo.github.io/" />

    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Sergey Simonov">
    <meta name="twitter:description" content="Read my CV, then Pepe will be happy.">
    <meta name="twitter:image" content="https://github.com/adelaidekangaroo/adelaidekangaroo/blob/main/qr-code_shining_2.png?raw=true">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c1c1e'/%3E%3Ctext x='5' y='22' font-size='14' fill='%23b6e67a' font-family='monospace'%3E%3E_%3C/text%3E%3C/svg%3E">
    <script src="script.js" defer></script>
    <title>Sergey Simonov / cv</title>
</head>
<body>
    <div class="wallpaper" aria-hidden="true">
        <span class="orb orb-a"></span>
        <span class="orb orb-b"></span>
        <span class="orb orb-c"></span>
    </div>

    <header class="menu-bar">
        <div class="menu-left">
            <span class="app-name">Terminal</span>
            <div class="menu">
                <button type="button" class="menu-btn" id="shell-menu-btn" aria-expanded="false" aria-controls="shell-menu">Shell</button>
                <div class="dropdown" id="shell-menu" hidden>
                    <button type="button" class="drop-item" data-cmd="help"><span class="check"></span>Help</button>
                    <button type="button" class="drop-item" data-cmd="cvfetch"><span class="check"></span>cvfetch</button>
                    <button type="button" class="drop-item" data-cmd="clear"><span class="check"></span>Clear Scrollback</button>
                    <button type="button" class="drop-item" data-cmd="pdf"><span class="check"></span>Export PDF</button>
                    <div class="drop-sep"></div>
                    <button type="button" class="drop-item" data-theme="pro"><span class="check"></span>Pro</button>
                    <button type="button" class="drop-item" data-theme="homebrew"><span class="check"></span>Homebrew</button>
                    <button type="button" class="drop-item" data-theme="ocean"><span class="check"></span>Ocean</button>
                    <button type="button" class="drop-item" data-theme="novel"><span class="check"></span>Novel</button>
                    <button type="button" class="drop-item" data-theme="manpage"><span class="check"></span>Man Page</button>
                    <button type="button" class="drop-item" data-theme="retro"><span class="check"></span>Retro</button>
                </div>
            </div>
        </div>
        <div class="menu-right">
            <time id="clock"></time>
        </div>
    </header>

    <div class="window" id="term" data-theme="pro">
        <div class="titlebar" id="titlebar">
            <div class="traffic">
                <button type="button" class="tl close" id="btn-close" aria-label="Close">
                    <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3.2 3.2 8.8 8.8M8.8 3.2 3.2 8.8"/></svg>
                </button>
                <button type="button" class="tl min" id="btn-min" aria-label="Minimize">
                    <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.4 6h7.2"/></svg>
                </button>
                <button type="button" class="tl zoom" id="btn-zoom" aria-label="Zoom">
                    <svg class="glyph-out" viewBox="0 0 12 12" aria-hidden="true"><path d="M6.8 2.2H9.8V5.2M9.8 2.2 6.3 5.7M5.2 9.8H2.2V6.8M2.2 9.8 5.7 6.3"/></svg>
                    <svg class="glyph-in" viewBox="0 0 12 12" aria-hidden="true"><path d="M9.8 5.2V2.2H6.8M9.8 2.2 6.3 5.7M2.2 6.8v3H5.2M2.2 9.8 5.7 6.3"/></svg>
                </button>
            </div>
            <div class="title" id="window-title">cv — zsh</div>
            <div></div>
        </div>
        <div class="window-body">
        <div class="screen" id="screen">
            <p class="login">Last login: <time id="login-time">just now</time> on ttys003</p>
            <p class="hint">type <kbd>help</kbd> and press return</p>
            <div id="cv"></div>
            <div id="shell-log" class="shell-log"></div>
        </div>
        <form class="shell" id="shell" autocomplete="off">
            <span class="ps1 ps1-full"></span>
            <span class="ps1 ps1-short">~ $</span>
            <span class="cmdline">
                <span class="cmdline-ghost" id="cmdline-ghost" aria-hidden="true"></span>
                <span class="block-caret" id="block-caret" aria-hidden="true"></span>
                <input id="cmd" name="cmd" type="text" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Команда">
            </span>
        </form>
        </div>
    </div>

    <div class="dock">
        <button type="button" class="dock-btn" id="dock" aria-label="Terminal">
            <svg viewBox="0 0 64 64" aria-hidden="true">
                <rect width="64" height="64" rx="14" fill="#1c1c1e"/>
                <rect x="0.5" y="0.5" width="63" height="63" rx="14" fill="none" stroke="rgba(255,255,255,0.16)"/>
                <text x="10" y="42" fill="#b6e67a" font-family="ui-monospace, monospace" font-size="22" font-weight="700">&gt;_</text>
            </svg>
            <span class="dock-dot"></span>
        </button>
    </div>
</body>
</html>
